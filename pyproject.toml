[build-system]
requires = ["scikit-build-core>=0.11", "cmake>=3.28", "ninja", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
sdist.cmake = true
cmake.version = ">=3.15"
cmake.build-type = "Release"

# Build a broad set of prebuilt wheels so that `pip install gbdc` finds a match on
# common targets (incl. minimal Docker images like python:slim and python:alpine) and
# never falls back to compiling from source. Covers CPython 3.10-3.14 on glibc
# (manylinux) and musl (musllinux); 32-bit and alternative interpreters are dropped.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*_i686 *-win32"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# Smoke-test every wheel by importing the compiled extension in an isolated env.
test-command = "python -c \"import gbdc\""

[tool.cibuildwheel.linux]
# libarchive is bundled into the wheel by auditwheel, so the resulting wheels are
# self-contained and need no system libarchive at install time. Install the build-time
# headers across manylinux (dnf/yum) and musllinux (apk) base images.
before-all = "if command -v dnf >/dev/null 2>&1; then dnf install -y libarchive-devel; elif command -v yum >/dev/null 2>&1; then yum install -y libarchive-devel; elif command -v apk >/dev/null 2>&1; then apk add --no-cache libarchive-dev; fi"

[project]
name = "gbdc"
version = "0.4.2"
description = "Extension Module for GBD"
requires-python = ">=3.10"

authors = [
  { name = "Ashlin Iser", email = "ashlin.iser@kit.edu" },
  { name = "Christoph Jabs", email = "christoph.jabs@helsinki.fi" },
]

maintainers = [{ name = "Ashlin Iser", email = "ashlin.iser@kit.edu" }]

readme = "README.md"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
]

[project.urls]
Homepage = "https://benchmark-database.de"
Documentation = "https://udopia.github.io/gbdc/"
Repository = "https://github.com/Udopia/gbdc"
