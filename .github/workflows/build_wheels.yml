name: Build Wheels
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
# LINUX (native runners per arch, no QEMU emulation)
  build-linux:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, march: x86-64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, march: armv8-a }
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2.0
      env:
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        # Portable baseline ISA + statically linked libstdc++/libgcc so wheels run on
        # older glibc hosts without SIGILL or GLIBCXX version-mismatch errors.
        CIBW_ENVIRONMENT_LINUX: 'CFLAGS="-O3 -march=${{ matrix.march }}" CXXFLAGS="-O3 -march=${{ matrix.march }}" LDFLAGS="-static-libstdc++ -static-libgcc"'
      with: { output-dir: wheelhouse }

    - name: Validate wheels
      shell: bash
      run: |
        python -m pip install --upgrade -q pip twine
        twine check wheelhouse/*.whl
        for w in wheelhouse/*.whl; do zip -T "$w" >/dev/null; done

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-${{ matrix.arch }}
        path: wheelhouse/*.whl

# macOS (native Apple Silicon / arm64 runner)
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache cibuildwheel downloads
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/cibuildwheel
        key: cibw-macos-${{ hashFiles('pyproject.toml', '.github/workflows/build_wheels.yml') }}
        restore-keys: |
          cibw-macos-

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2.0
      env:
        CIBW_ARCHS_MACOS: "arm64"
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        # Wheel-only: build a fully static libarchive + compression backends targeting
        # macOS 11.0 into /tmp/deps, so the extension is self-contained (delocate bundles
        # nothing) and installs on macOS 11+. CMake links it statically via pkg-config.
        CIBW_ENVIRONMENT_MACOS: 'CMAKE_PREFIX_PATH="/tmp/deps" PKG_CONFIG_PATH="/tmp/deps/lib/pkgconfig" MACOSX_DEPLOYMENT_TARGET="11.0"'
        CIBW_BEFORE_ALL_MACOS: |
          set -eo pipefail
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export PKG_CONFIG_PATH=/tmp/deps/lib/pkgconfig
          mkdir -p /tmp/deps
          cd /tmp

          # liblzma (.xz) -- 5.6.2 is the clean release after CVE-2024-3094
          curl -sSL https://github.com/tukaani-project/xz/releases/download/v5.6.2/xz-5.6.2.tar.gz | tar xz
          cd xz-5.6.2 && ./configure --prefix=/tmp/deps --enable-static --disable-shared && make -j"$(sysctl -n hw.ncpu)" install && cd /tmp

          # liblz4 (.lz4)
          curl -sSL https://github.com/lz4/lz4/archive/refs/tags/v1.9.4.tar.gz | tar xz
          cd lz4-1.9.4 && make -j"$(sysctl -n hw.ncpu)" BUILD_SHARED=no PREFIX=/tmp/deps install && cd /tmp

          # libzstd (.zst)
          curl -sSL https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz | tar xz
          cd zstd-1.5.6 && make -j"$(sysctl -n hw.ncpu)" BUILD_SHARED=no PREFIX=/tmp/deps install && cd /tmp

          # Drop any shared libs so downstream links resolve to the static archives only.
          rm -f /tmp/deps/lib/*.dylib /tmp/deps/lib/*.so*

          # Full libarchive (.tar/.zip/.7z + .gz/.bz2 via the universal system zlib/bz2)
          curl -sSL https://github.com/libarchive/libarchive/releases/download/v3.7.7/libarchive-3.7.7.tar.gz | tar xz
          cd libarchive-3.7.7
          ./configure --prefix=/tmp/deps --enable-static --disable-shared \
            CPPFLAGS="-I/tmp/deps/include" LDFLAGS="-L/tmp/deps/lib"
          make -j"$(sysctl -n hw.ncpu)" install
      with: { output-dir: wheelhouse }

    - name: Validate wheels
      shell: bash
      run: |
        python -m pip install --upgrade -q twine
        twine check wheelhouse/*.whl
        for w in wheelhouse/*.whl; do zip -T "$w" >/dev/null; done

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-macos
        path: wheelhouse/*.whl

# SOURCE DISTRIBUTION
  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y libarchive-dev

    - name: Build sdist
      run: |
        python -m pip install --upgrade -q build twine
        python -m build --sdist
        twine check dist/*.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

# PUBLISH to PYPI (Trusted Publishing / OIDC)
  release:
    needs: [build-linux, build-macos, build-sdist]
    runs-on: ubuntu-latest
    # Configure a PyPI Trusted Publisher for project "gbdc" pointing at this
    # repository, workflow "build_wheels.yml", and environment "pypi".
    environment:
      name: pypi
      url: https://pypi.org/p/gbdc
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
